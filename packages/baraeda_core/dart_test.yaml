# 시험 태그 선언 — 선언이 없으면 `--exclude-tags` 가 아무것도 거르지 않는 빈 플래그가 된다
# (2026-09-13 실측: 좌석이 "실서버 시험을 제외했다" 고 믿었는데 전부 돌아 시드 DB 를 오염시켰다).
tags:
  real_backend:
    # 실제 백엔드에 접속하는 계약 시험. `--dart-define=API_BASE_URL` 이 필수이며
    # 없으면 `requireRealBackendBaseUrl()` 이 던진다(test/support/real_backend_target.dart).

# real_backend_auth_test.dart 의 setUpAll 이 driver_blocked_seed_reset.dart 를 거쳐
# `POST /dev/reset`(Flyway clean+migrate, 순간적이지 않다)을 조건부로 부른다. 다른
# real_backend 파일(baraeda_websocket_client_connect_test.dart 등)이 그 재구성 도중
# 같은 스키마를 동시에 읽으면 전이 상태(테이블 없음·부분 시드)를 코드 결함과 구별할 수
# 없이 관측한다 — parent-app(F5 P2)·manager-app(F5 M3)이 같은 이유로 이미 적용한 것과 동일.
concurrency: 1
