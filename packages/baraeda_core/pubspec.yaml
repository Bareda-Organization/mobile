name: baraeda_core
description: "바래다 공용 네트워크 · 에러 · 토큰 저장 패키지 — apps/parent-app · apps/manager-app 가 이 패키지 하나에 의존한다."
version: 0.0.1
homepage:

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_secure_storage_platform_interface: '>=2.1.0 <3.0.0'  # 시험용 가짜 구현체가 2.1.0 의 checkUpgradeStatus 를 구현한다 — 하한을 낮추면 그 타입이 없어 컴파일이 깨진다
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^10.3.0

